name: WATI Delivery Audit

on:
  push:
    branches:
      - chore/wati-delivery-cleanup

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit tracked repository artifacts
        run: |
          python - <<'PY'
          import subprocess
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          bad = [path for path in tracked if '/__pycache__/' in f'/{path}/' or path.endswith(('.pyc', '.pyo')) or path.endswith('/.DS_Store') or path == '.DS_Store']
          if bad:
              raise SystemExit('Tracked generated artifacts:\n' + '\n'.join(bad))
          print('No generated Python/macOS artifacts are tracked.')
          PY

      - name: Compile Python
        run: |
          for module in custom_addons/wati_connector*; do
            [ -d "$module" ] || continue
            python -m compileall -q "$module"
          done

      - name: Validate manifests and XML
        run: |
          python - <<'PY'
          import ast
          import xml.etree.ElementTree as ET
          from pathlib import Path
          modules = [p for p in Path('custom_addons').glob('wati_connector*') if (p / '__manifest__.py').exists()]
          for module in modules:
              manifest = ast.literal_eval((module / '__manifest__.py').read_text(encoding='utf-8'))
              for rel in manifest.get('data', []):
                  path = module / rel
                  if not path.exists():
                      raise SystemExit(f'Missing manifest file: {path}')
              for xml in module.rglob('*.xml'):
                  ET.parse(xml)
          print('Manifest/XML validation passed')
          PY

      - name: Audit delivery hygiene
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          import re
          import subprocess
          tracked = subprocess.check_output(['git', 'ls-files', 'custom_addons/wati_connector*'], text=True).splitlines()
          runtime_ext = {'.py', '.js', '.xml'}
          skip = {'tests', 'docs', 'migrations', 'i18n'}
          hard_fail = []
          notes = []
          debug_patterns = {
              'python print': re.compile(r'(^|[^\w])print\s*\('),
              'breakpoint': re.compile(r'\bbreakpoint\s*\('),
              'pdb': re.compile(r'\bpdb\.set_trace\s*\('),
              'console.log': re.compile(r'\bconsole\.log\s*\('),
              'javascript debugger': re.compile(r'(^|[;\s])debugger\s*;'),
          }
          note_pattern = re.compile(r'\b(TODO|FIXME|XXX|HACK|TEMPORARY|DEBUG ONLY)\b', re.I)
          for raw in tracked:
              path = Path(raw)
              if path.suffix not in runtime_ext or skip.intersection(path.parts):
                  continue
              text = path.read_text(encoding='utf-8')
              for line_no, line in enumerate(text.splitlines(), 1):
                  for label, pattern in debug_patterns.items():
                      if pattern.search(line):
                          hard_fail.append(f'{label}: {path}:{line_no}')
                  if note_pattern.search(line):
                      notes.append(f'{path}:{line_no}: {line.strip()}')
          core = Path('custom_addons/wati_connector')
          manifest = ast.literal_eval((core / '__manifest__.py').read_text(encoding='utf-8'))
          repair_data = [item for item in manifest.get('data', []) if 'repair' in Path(item).name.lower()]
          if repair_data:
              hard_fail.append('one-off repair XML still loaded by manifest: ' + ', '.join(repair_data))
          suspicious_names = []
          tokens = ('_fix.py', '_repair.py', '_final.py', '_truth.py', '_compat.py', '_review.py')
          for path in (core / 'models').glob('*.py'):
              if any(path.name.endswith(token) for token in tokens):
                  suspicious_names.append(str(path))
          print(f'SUSPICIOUS_MODEL_FILES={len(suspicious_names)}')
          for item in suspicious_names:
              print('SUSPICIOUS_MODEL=' + item)
          print(f'DEVELOPMENT_MARKERS={len(notes)}')
          for item in notes:
              print('DEVELOPMENT_MARKER=' + item)
          if hard_fail:
              raise SystemExit('Delivery hygiene failures:\n' + '\n'.join(hard_fail))
          print('Delivery hygiene passed')
          PY

      - name: Ruff correctness smoke
        if: always()
        continue-on-error: true
        run: |
          python -m pip install --quiet ruff
          ruff check custom_addons/wati_connector custom_addons/wati_connector_crm custom_addons/wati_connector_sale custom_addons/wati_connector_account custom_addons/wati_connector_project \
            --select E9,F63,F7,F82,T20 --exclude tests,migrations --output-format concise

      - name: Report runtime hooks and repair calls
        if: always()
        run: |
          echo '--- model init hooks ---'
          grep -RInE '^\s*def init\s*\(|post_init_hook|pre_init_hook|uninstall_hook' custom_addons/wati_connector --include='*.py' --exclude-dir=tests --exclude-dir=migrations || true
          echo '--- repair/backfill methods ---'
          grep -RInE '^\s*def (_.*repair|_.*backfill)|^\s*@api\.model' custom_addons/wati_connector/models --include='*.py' | grep -E 'repair|backfill|init' || true
          echo '--- repair method invocations outside migrations/tests ---'
          grep -RInE '_repair_|_backfill_' custom_addons/wati_connector --include='*.py' --include='*.xml' --exclude-dir=tests --exclude-dir=migrations || true

      - name: Report unreferenced inbox assets
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('custom_addons/wati_connector')
          inbox = root / 'static/src/inbox'
          tracked_text = []
          for path in root.rglob('*'):
              if path.is_file() and path.suffix in {'.py', '.xml', '.js', '.css', '.scss'}:
                  try:
                      tracked_text.append((path, path.read_text(encoding='utf-8')))
                  except UnicodeDecodeError:
                      pass
          candidates = []
          for asset in sorted(p for p in inbox.iterdir() if p.is_file()):
              rel = str(asset.relative_to(root))
              refs = []
              for other, text in tracked_text:
                  if other == asset:
                      continue
                  if rel in text or asset.name in text:
                      refs.append(str(other.relative_to(root)))
              if not refs:
                  candidates.append(rel)
              print(f'ASSET={rel} REFS={len(refs)} ' + (','.join(refs[:6]) if refs else 'UNREFERENCED'))
          print(f'UNREFERENCED_INBOX_ASSETS={len(candidates)}')
          for rel in candidates:
              print('UNREFERENCED=' + rel)
          PY

      - name: Report architecture inventory
        if: always()
        run: |
          echo '--- largest WATI Python files ---'
          find custom_addons/wati_connector -name '*.py' -type f -not -path '*/__pycache__/*' -printf '%s %p\n' | sort -nr | head -20
          echo '--- repair/data files ---'
          find custom_addons/wati_connector/data -type f -maxdepth 1 -print | sort
          echo '--- migrations ---'
          find custom_addons/wati_connector/migrations -type f -not -path '*/__pycache__/*' -print 2>/dev/null | sort || true
