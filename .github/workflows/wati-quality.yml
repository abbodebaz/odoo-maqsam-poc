name: WATI Connector Quality

on:
  push:
    branches:
      - refactor/wati-commercial-ready
  pull_request:
    paths:
      - 'custom_addons/wati_connector*/**'
      - '.github/workflows/wati-quality.yml'

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python sources
        run: |
          for module in custom_addons/wati_connector*; do
            [ -d "$module" ] || continue
            python -m compileall -q "$module"
          done

      - name: Audit WATI source language
        run: |
          python - <<'PY'
          from collections import defaultdict
          from pathlib import Path
          import re

          arabic = re.compile(r'[\u0600-\u06FF]')
          extensions = {'.py', '.xml', '.js'}
          skipped_parts = {'tests', 'docs', 'notes', 'i18n', 'migrations'}
          by_file = defaultdict(list)
          for module in sorted(Path('custom_addons').glob('wati_connector*')):
              if not module.is_dir():
                  continue
              for path in module.rglob('*'):
                  if not path.is_file() or path.suffix not in extensions:
                      continue
                  if skipped_parts.intersection(path.parts):
                      continue
                  for line_no, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                      if arabic.search(line):
                          by_file[str(path)].append(line_no)
          total = sum(len(lines) for lines in by_file.values())
          print(f'WATI_ARABIC_SOURCE_HITS={total}')
          print(f'WATI_ARABIC_SOURCE_FILES={len(by_file)}')
          for path, lines in sorted(by_file.items()):
              line_list = ','.join(map(str, lines))
              print(f'::warning file={path},line={lines[0]}::Arabic runtime source lines: {line_list}')
          PY

      - name: Validate XML, manifests and architecture boundaries
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          import xml.etree.ElementTree as ET

          modules = sorted(
              path for path in Path('custom_addons').glob('wati_connector*')
              if path.is_dir() and (path / '__manifest__.py').exists()
          )
          if not modules:
              raise SystemExit('No WATI modules found')

          for module in modules:
              manifest = module / '__manifest__.py'
              data = ast.literal_eval(manifest.read_text(encoding='utf-8'))
              assert data.get('installable') is True, f'{module.name} must remain installable'
              assert data.get('license'), f'{module.name} must declare a license'
              for xml_file in module.rglob('*.xml'):
                  try:
                      ET.parse(xml_file)
                  except ET.ParseError as exc:
                      raise SystemExit(f'Invalid XML: {xml_file}: {exc}') from exc
              for relative in data.get('data', []):
                  path = module / relative
                  if not path.exists():
                      raise SystemExit(f'{module.name} manifest references missing file: {relative}')

          core = Path('custom_addons/wati_connector')
          core_manifest = ast.literal_eval((core / '__manifest__.py').read_text(encoding='utf-8'))
          forbidden_dependencies = {'crm', 'sale', 'sale_management', 'account', 'project', 'helpdesk', 'industry_fsm'}
          leaked = forbidden_dependencies.intersection(core_manifest.get('depends', []))
          if leaked:
              raise SystemExit(f'Core leaks optional business dependencies: {sorted(leaked)}')

          forbidden_models = ('crm.lead', 'sale.order', 'account.move', 'project.task', 'helpdesk.ticket')
          for source in list((core / 'models').rglob('*.py')) + list((core / 'views').rglob('*.xml')):
              text = source.read_text(encoding='utf-8')
              for model in forbidden_models:
                  if model in text:
                      raise SystemExit(f'Optional model {model} leaked into WATI core: {source}')

          allowed_request_files = {
              core / 'services' / 'client.py',
              core / 'services' / 'media.py',
          }
          for module in modules:
              for source in module.rglob('*.py'):
                  if source in allowed_request_files:
                      continue
                  text = source.read_text(encoding='utf-8')
                  if 'import requests' in text or 'requests.' in text:
                      raise SystemExit(
                          f'Direct HTTP transport outside WATI service layer: {source}'
                      )

          print('Static WATI validation passed for:', ', '.join(module.name for module in modules))
          PY
