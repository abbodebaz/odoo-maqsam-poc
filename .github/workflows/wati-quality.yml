name: WATI Connector Quality

on:
  push:
    branches:
      - refactor/wati-commercial-ready
  pull_request:
    paths:
      - 'custom_addons/wati_connector/**'
      - '.github/workflows/wati-quality.yml'

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python sources
        run: python -m compileall -q custom_addons/wati_connector

      - name: Validate XML and manifest
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          import xml.etree.ElementTree as ET

          module = Path('custom_addons/wati_connector')
          manifest = module / '__manifest__.py'
          data = ast.literal_eval(manifest.read_text(encoding='utf-8'))
          assert data.get('installable') is True, 'Module must remain installable'
          assert data.get('license'), 'Manifest must declare a license'

          for xml_file in module.rglob('*.xml'):
              try:
                  ET.parse(xml_file)
              except ET.ParseError as exc:
                  raise SystemExit(f'Invalid XML: {xml_file}: {exc}') from exc

          for relative in data.get('data', []):
              path = module / relative
              if not path.exists():
                  raise SystemExit(f'Manifest references missing file: {relative}')

          print('Static WATI validation passed')
          PY
